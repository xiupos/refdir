[package]
name = "refdir"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "The rules of refdir v1, a folder format for reference libraries"
repository = "https://github.com/xiupos/refdir-cli"

[dependencies]
# The resolved item depends on the order of the keys in `sources`
serde_json = { version = "1", features = ["preserve_order"] }

[dev-dependencies]
tempfile = "3"

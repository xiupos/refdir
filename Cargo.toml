[package]
name = "refdir"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "A library of references: a folder of BibTeX entries, a command, and a GNOME app"
repository = "https://github.com/xiupos/refdir"
# The iOS app is in the repository, not the crate
exclude = ["/ios"]

[[bin]]
name = "refdir"
required-features = ["cli"]

[[bin]]
name = "refdir-gtk"
required-features = ["gui"]

[features]
default = ["cli", "gui"]
cli = ["dep:clap"]
gui = ["dep:gtk", "dep:adw", "dep:relm4", "dep:gdk-wayland", "dep:gdk-x11"]

[dependencies]
# Reading BibTeX, its values as written
biblatex = "0.12"
# Titles' TeX as text; in alpha, so pinned
techxt = "=0.2.1"
# Finding `Gürsey` by `gursey`
unicode-normalization = "0.1"
# INSPIRE, doi.org, and arXiv
ureq = "3.5.0"
clap = { version = "4", features = ["derive", "env"], optional = true }
gtk = { version = "0.11.5", package = "gtk4", features = ["v4_12"], optional = true }
adw = { version = "0.9.2", package = "libadwaita", features = ["v1_8"], optional = true }
relm4 = { version = "0.11", features = ["macros", "libadwaita", "gnome_47"], optional = true }
# The window's handle, for the previewer to show over it
gdk-wayland = { version = "0.11.5", package = "gdk4-wayland", features = ["v4_12"], optional = true }
gdk-x11 = { version = "0.11.5", package = "gdk4-x11", optional = true }

[dev-dependencies]
serde_json = "1"
tempfile = "3"
